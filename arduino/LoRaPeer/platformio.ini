[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; RSA-2048 (mbedtls) y TLS usan varios KB de stack; el loopTask por defecto
; (8 KB) se desborda. Lo ampliamos a 16 KB.
build_flags = -D ARDUINO_LOOP_STACK_SIZE=16384
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.3
    knolleary/PubSubClient @ ^2.8

test_framework = unity
; La logica pura (Huffman, pairing) se prueba en el entorno nativo, no en la placa.
test_ignore = test_compression, test_pairing

; Entorno de PRUEBA en placa: logs detallados (DIAG_LOGS) y comando TESTUI para
; forzar las pantallas de la OLED. NO usar en produccion.
;   pio run -e esp32dev_debug --target upload
[env:esp32dev_debug]
extends = env:esp32dev
build_flags = -D ARDUINO_LOOP_STACK_SIZE=16384 -D DIAG_LOGS=1

; Entorno nativo: corre la logica pura sin hardware.
;   pio test -e native
; El cifrado RSA-2048 usa mbedtls (solo en la placa); su interoperabilidad se
; verifica del lado de la app contra un vector generado con OpenSSL.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
test_filter = test_compression, test_pairing
