[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.3
    knolleary/PubSubClient @ ^2.8

test_framework = unity
; La compresion Huffman (logica pura) se prueba en el entorno nativo, no en la placa.
test_ignore = test_compression

; Entorno nativo: corre la logica pura sin hardware.
;   pio test -e native
; El cifrado RSA-2048 usa mbedtls (solo en la placa); su interoperabilidad se
; verifica del lado de la app contra un vector generado con OpenSSL.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
test_filter = test_compression
