[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.3
    knolleary/PubSubClient @ ^2.8

test_framework = unity
; Las pruebas de logica pura (Huffman + RSA) corren en el entorno nativo, no en la placa.
test_ignore = test_compression, test_crypto

; Entorno nativo: corre la logica pura sin hardware.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
test_filter = test_compression, test_crypto
